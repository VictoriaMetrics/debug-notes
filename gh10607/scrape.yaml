global:
  scrape_interval: 10s
scrape_configs:
  - job_name: vmagent
    static_configs:
      - targets:
          - 127.0.0.1:8429
    relabel_configs:
      - target_label: "add_label_before_scrape_1"
        replacement: "label_value_1"
    metric_relabel_configs:
      - target_label: "add_label_after_scrape_1"
        replacement: "label_value_2"