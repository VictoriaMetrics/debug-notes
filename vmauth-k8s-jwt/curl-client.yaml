apiVersion: v1
kind: ServiceAccount
metadata:
  name: curl-client
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl-client
spec:
  replicas: 1
  selector:
    matchLabels: {app: curl-client}
  template:
    metadata:
      labels: {app: curl-client}
    spec:
      serviceAccountName: curl-client
      automountServiceAccountToken: false
      containers:
      - name: curl
        image: curlimages/curl:8.11.1
        command: ["/bin/sh", "-c"]
        args:
        - |
          while true; do
            # re-read on every iteration: kubelet rotates the projected token
            TOKEN=$(cat /var/run/secrets/vmauth/token)
            echo "$(date -u +%FT%TZ) $(curl -s -w ' http_code=%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              'http://vmauth:8427/api/v1/query?query=up')"
            sleep 5
          done
        volumeMounts:
        - name: vmauth-token
          mountPath: /var/run/secrets/vmauth
          readOnly: true
      volumes:
      - name: vmauth-token
        projected:
          sources:
          - serviceAccountToken:
              audience: vmauth-prod-eu-1        # unique per cluster
              expirationSeconds: 3600
              path: token
